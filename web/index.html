<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NESER Web</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
      }
      #status {
        font-size: 0.9rem;
        color: #8fe28f;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NESER Web (MVP)</h1>
      <input type="file" id="rom" accept=".nes" />
      <button id="start">Start</button>
      <span id="status">Load a ROM to begin</span>
    </header>
    <canvas id="screen" width="256" height="240"></canvas>
    <script type="module" src="./pkg/neser.js"></script>
    <script type="module">
      import init, { WasmNes } from "./pkg/neser.js";

      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("start");
      const romInput = document.getElementById("rom");
      const canvas = document.getElementById("screen");
      if (!(canvas instanceof HTMLCanvasElement)) {
        throw new Error("Canvas element with id 'screen' not found or not a canvas");
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        throw new Error("2D rendering context not available for canvas 'screen'");
      }
      const imageData = ctx.createImageData(256, 240);
      let nes;
      let romBytes;
      let running = false;
      let paused = false;
      let lastFrameTime = 0;
      const frameInterval = 1000 / 60.0988; // approx NTSC

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? "#f88" : "#8fe28f";
      }

      romInput.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        romBytes = new Uint8Array(await file.arrayBuffer());
        setStatus(`Loaded ROM: ${file.name} (${romBytes.length} bytes)`);
      });

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      async function start() {
        if (startBtn.disabled) {
          return;
        }
        startBtn.disabled = true;
        if (!romBytes) {
          setStatus("Please choose a ROM first", true);
          startBtn.disabled = false;
          return;
        }
        setStatus("Initializing emulator...");
        if (!nes) {
          try {
            await init();
            nes = new WasmNes();
          } catch (err) {
            setStatus(`Failed to initialize emulator: ${err}`, true);
            startBtn.disabled = false;
            return;
          }
        }
        try {
          nes.load_rom(romBytes);
        } catch (err) {
          const msg =
            typeof err === "string"
              ? err
              : err && err.message
                ? err.message
                : `${err}`;
          const friendly =
            msg.toLowerCase().includes("invalid") || msg.toLowerCase().includes("file too small")
              ? "Invalid ROM file format"
              : msg.toLowerCase().includes("unsupported mapper")
                ? "Unsupported ROM mapper"
                : msg;
          setStatus(`Failed to load ROM: ${friendly}`, true);
          startBtn.disabled = false;
          return;
        }
        running = true;
        paused = false;
        lastFrameTime = 0;
        startBtn.disabled = true;
        setStatus("Running...");
        requestAnimationFrame(step);
      }

      function pauseResume() {
        if (!nes || !running) return;
        paused = !paused;
        if (!paused) {
          lastFrameTime = 0;
          setStatus("Running...");
          requestAnimationFrame(step);
        } else {
          setStatus("Paused");
        }
      }

      function stop() {
        running = false;
        paused = false;
        startBtn.disabled = false;
        clearCanvas();
        romBytes = null;
        romInput.value = "";
        romInput.disabled = false;
        lastFrameTime = 0;
        setStatus("Stopped. Load a ROM to begin");
      }

      function step(timestamp) {
        if (!running || paused) return;
        if (timestamp - lastFrameTime < frameInterval) {
          requestAnimationFrame(step);
          return;
        }
        lastFrameTime = timestamp;
        try {
          const frame = nes.render_frame();
          // frame is RGB888; convert to RGBA for canvas
          const data = imageData.data;
          for (let i = 0, j = 0; i < frame.length; i += 3, j += 4) {
            data[j] = frame[i];
            data[j + 1] = frame[i + 1];
            data[j + 2] = frame[i + 2];
            data[j + 3] = 0xff;
          }
          ctx.putImageData(imageData, 0, 0);
        } catch (err) {
          running = false;
          setStatus(`Emulation error: ${err}`, true);
          if (console && typeof console.error === "function") {
            console.error("Emulation error during render_frame", err);
          }
        }
        if (running) {
          requestAnimationFrame(step);
        }
      }

      startBtn.addEventListener("click", start);
      const pauseBtn = document.createElement("button");
      pauseBtn.textContent = "Pause/Resume";
      pauseBtn.addEventListener("click", pauseResume);
      startBtn.insertAdjacentElement("afterend", pauseBtn);

      const stopBtn = document.createElement("button");
      stopBtn.textContent = "Stop";
      stopBtn.addEventListener("click", stop);
      pauseBtn.insertAdjacentElement("afterend", stopBtn);
    </script>
  </body>
</html>
