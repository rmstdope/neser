<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NESER Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>NESER Web (MVP)</h1>
      <label for="rom">ROM file:</label>
      <input type="file" id="rom" accept=".nes" />
      <button id="start">Start</button>
      <button id="mute" aria-pressed="false">Mute</button>
      <span id="status">Load a ROM to begin</span>
    </header>
    <div id="screen-controls" style="display: flex; gap: 8px; margin-bottom: 8px;">
      <button id="screen-minus">Screen -</button>
      <button id="screen-plus">Screen +</button>
      <button id="fullscreen">Fullscreen</button>
      <button id="gamepad-toggle" aria-pressed="true">Gamepad On</button>
      <button id="filter-toggle">Filter</button>
    </div>
    <canvas id="screen" width="256" height="240"></canvas>
    <div id="controls">
      <strong>Controls:</strong> W = Up | A = Left | S = Down | D = Right | F = A | G = B | R = Select | T = Start
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
