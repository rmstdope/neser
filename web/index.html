<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NESER Web</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
      }
      #status {
        font-size: 0.9rem;
        color: #8fe28f;
      }
      #controls {
        font-size: 0.85rem;
        color: #999;
        text-align: center;
        max-width: 600px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NESER Web (MVP)</h1>
      <label for="rom">ROM file:</label>
      <input type="file" id="rom" accept=".nes" />
      <button id="start">Start</button>
      <button id="mute" aria-pressed="false">Mute</button>
      <span id="status">Load a ROM to begin</span>
    </header>
    <div id="screen-controls" style="display: flex; gap: 8px; margin-bottom: 8px;">
      <button id="screen-minus">Screen -</button>
      <button id="screen-plus">Screen +</button>
      <button id="fullscreen">Fullscreen</button>
      <button id="gamepad-toggle" aria-pressed="true">Gamepad On</button>
      <button id="filter-toggle">Filter: NTSC Composite</button>
    </div>
    <canvas id="screen" width="256" height="240"></canvas>
    <div id="controls">
      <strong>Controls:</strong> W = Up | A = Left | S = Down | D = Right | F = A | G = B | R = Select | T = Start
    </div>
    <script type="module">
      import init, { WasmNes } from "./pkg/neser.js";
      import { mapStandardGamepadState, selectPrimaryGamepad } from "./gamepad.js";

      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("start");
      const romInput = document.getElementById("rom");
      const canvas = document.getElementById("screen");
      if (!(canvas instanceof HTMLCanvasElement)) {
        throw new Error("Canvas element with id 'screen' not found or not a canvas");
      }
      
      const width = 256;
      const height = 240;
      let nes;
      let romBytes;
      let running = false;
      let paused = false;
      let lastFrameTime = 0;
      const fpsLogIntervalMs = 1000;
      let fpsLastTime = 0;
      let fpsFrames = 0;
      let useFilters = true; // Use librashader filters by default

      // Web Audio API setup
      let audioContext = null;
      let nextAudioTime = 0;
      const AUDIO_SAMPLE_RATE = 44100; // Target output sample rate for Web Audio (NES audio is downsampled to this rate)
      const NES_APU_MAX = 1.177; // Conservative max output from NES APU mixer including expansion audio
      let audioMuted = false;
      let gamepadEnabled = true;
      let lastGamepadState = {
        a: false,
        b: false,
        select: false,
        start: false,
        up: false,
        down: false,
        left: false,
        right: false
      };

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? "#f88" : "#8fe28f";
      }

      romInput.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        romBytes = new Uint8Array(await file.arrayBuffer());
        setStatus(`Loaded ROM: ${file.name} (${romBytes.length} bytes)`);
      });

      function clearCanvas() {
        if (useFilters) {
          // WebGL will clear automatically
        } else if (window.fallbackCtx) {
          window.fallbackCtx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      function initAudioContext() {
        if (!audioContext) {
          // Create AudioContext on first user interaction (required by browsers)
          audioContext = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: AUDIO_SAMPLE_RATE
          });
          nextAudioTime = audioContext.currentTime;
          console.log(`Audio initialized: ${audioContext.sampleRate} Hz`);
        }
      }

      function playAudioSamples(samples) {
        if (!audioContext || audioMuted || samples.length === 0) return;

        // Create an audio buffer for the samples
        const buffer = audioContext.createBuffer(1, samples.length, audioContext.sampleRate);
        const channelData = buffer.getChannelData(0);

        // Normalize and copy samples to the buffer
        // NES APU outputs 0.0 to ~1.177, normalize to 0.0 to 1.0 for Web Audio
        for (let i = 0; i < samples.length; i++) {
          // Map NES 0.0-1.177 to Web Audio 0.0-1.0 (0.0 represents silence)
          const normalized = samples[i] / NES_APU_MAX;
          channelData[i] = Math.min(1.0, Math.max(0.0, normalized));
        }

        // Create a buffer source and schedule it
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);

        // Schedule playback at the next available time
        // Ensure smooth continuous playback by scheduling samples back-to-back
        const now = audioContext.currentTime;
        if (nextAudioTime < now) {
          nextAudioTime = now;
        }
        // Cap how far ahead of real-time we schedule audio to avoid unbounded latency
        const MAX_AUDIO_LOOKAHEAD = 0.5; // seconds
        if (nextAudioTime - now > MAX_AUDIO_LOOKAHEAD) {
          nextAudioTime = now + MAX_AUDIO_LOOKAHEAD;
        }
        source.start(nextAudioTime);
        nextAudioTime += buffer.duration;
      }

      async function start() {
        // Prevent concurrent starts by disabling the button immediately.
        if (startBtn.disabled) {
          return;
        }
        startBtn.disabled = true;
        romInput.disabled = true;
        if (!romBytes) {
          setStatus("Please choose a ROM first", true);
          startBtn.disabled = false;
          romInput.disabled = false;
          return;
        }
        setStatus("Initializing emulator...");
        try {
          if (!nes) {
            const wasmUrl = new URL("./pkg/neser_bg.wasm", import.meta.url);
            await init(wasmUrl);
            nes = new WasmNes();
            
            // Initialize the WebGL renderer with librashader
            try {
              nes.init_renderer("screen");
              const filterName = nes.get_current_filter_name();
              updateFilterButton(filterName);
              useFilters = true;
            } catch (err) {
              console.warn("Failed to initialize WebGL renderer, falling back to 2D canvas:", err);
              useFilters = false;
              // Initialize 2D context as fallback
              const ctx = canvas.getContext("2d");
              if (ctx) {
                window.fallbackCtx = ctx;
                window.fallbackImageData = ctx.createImageData(width, height);
              }
            }
          }
          nes.load_rom(romBytes);
          // Initialize audio context on user interaction (browser requirement)
          initAudioContext();
          nes.set_audio_muted(audioMuted);
        } catch (err) {
          setStatus(`Failed to load ROM: ${err}`, true);
          startBtn.disabled = false;
          romInput.disabled = false;
          return;
        }
        running = true;
        paused = false;
        // Keep start button disabled while running; it is re-enabled in stop().
        setStatus("Running...");
        requestAnimationFrame(step);
      }

      function pauseResume() {
        if (!nes || !running) return;
        paused = !paused;
        if (!paused) {
          lastFrameTime = 0;
          setStatus("Running...");
          requestAnimationFrame(step);
        } else {
          setStatus("Paused");
        }
      }

      function stop() {
        running = false;
        paused = false;
        startBtn.disabled = false;
        clearCanvas();
        lastFrameTime = 0;
        setStatus("Stopped. You can restart or load a new ROM");
        romInput.disabled = false;
      }

      function step(timestamp) {
        if (!running || paused) return;
        lastFrameTime = timestamp;
        try {
          if (gamepadEnabled && nes) {
            pollGamepad();
          }
          
          if (useFilters) {
            // Use librashader-based rendering
            const viewportWidth = canvas.width;
            const viewportHeight = canvas.height;
            nes.render_frame_filtered(viewportWidth, viewportHeight);
          } else {
            // Fallback to 2D canvas rendering
            const frame = nes.render_frame_rgba(); // RGBA8888
            if (window.fallbackImageData && window.fallbackCtx) {
              window.fallbackImageData.data.set(frame);
              window.fallbackCtx.putImageData(window.fallbackImageData, 0, 0);
            }
          }
          
          // Get and play audio samples
          const audioSamples = nes.get_audio_samples();
          if (audioSamples.length > 0) {
            playAudioSamples(audioSamples);
          }
          
          fpsFrames += 1;
          if (fpsLastTime === 0) {
            fpsLastTime = timestamp;
          }
          const fpsElapsed = timestamp - fpsLastTime;
          if (fpsElapsed >= fpsLogIntervalMs) {
            const fps = (fpsFrames * 1000) / fpsElapsed;
            console.log(`FPS: ${fps.toFixed(1)}`);
            fpsFrames = 0;
            fpsLastTime = timestamp;
          }
        } catch (err) {
          running = false;
          startBtn.disabled = false;
          romInput.disabled = false;
          setStatus(`Emulation error: ${err}`, true);
          if (console && typeof console.error === "function") {
            console.error("Emulation error during render_frame", err);
          }
        }
        if (running) {
          requestAnimationFrame(step);
        }
      }

      startBtn.addEventListener("click", start);
      const gamepadToggleBtn = document.getElementById("gamepad-toggle");
      function updateGamepadButton() {
        gamepadToggleBtn.textContent = gamepadEnabled ? "Gamepad On" : "Gamepad Off";
        gamepadToggleBtn.setAttribute("aria-pressed", gamepadEnabled ? "true" : "false");
      }
      gamepadToggleBtn.addEventListener("click", () => {
        gamepadEnabled = !gamepadEnabled;
        updateGamepadButton();
        if (!gamepadEnabled) {
          resetGamepadState();
        }
      });
      updateGamepadButton();
      const muteBtn = document.getElementById("mute");
      function updateMuteButton() {
        muteBtn.textContent = audioMuted ? "Unmute" : "Mute";
        muteBtn.setAttribute("aria-pressed", audioMuted ? "true" : "false");
      }
      muteBtn.addEventListener("click", async () => {
        audioMuted = !audioMuted;
        updateMuteButton();
        if (nes) {
          nes.set_audio_muted(audioMuted);
        }
        if (audioContext) {
          try {
            if (audioMuted && audioContext.state === "running") {
              await audioContext.suspend();
            } else if (!audioMuted && audioContext.state === "suspended") {
              nextAudioTime = audioContext.currentTime;
              await audioContext.resume();
            }
          } catch (err) {
            console.error("Failed to toggle audio context state:", err);
          }
        }
      });
      updateMuteButton();
      const pauseBtn = document.createElement("button");
      pauseBtn.id = "pause";
      pauseBtn.textContent = "Pause/Resume";
      pauseBtn.setAttribute("aria-label", "Pause or resume emulation");
      pauseBtn.addEventListener("click", pauseResume);
      startBtn.insertAdjacentElement("afterend", pauseBtn);

      const stopBtn = document.createElement("button");
      stopBtn.id = "stop";
      stopBtn.textContent = "Stop";
      stopBtn.setAttribute("aria-label", "Stop emulation");
      stopBtn.addEventListener("click", stop);
      pauseBtn.insertAdjacentElement("afterend", stopBtn);

      // Keyboard input for controller 1
      // Mapping: W=Up, S=Down, A=Left, D=Right, G=B, F=A, R=Select, T=Start
      const keyToButton = {
        'w': { button: 4, name: 'Up' },      // Button 4 = Up
        's': { button: 5, name: 'Down' },    // Button 5 = Down
        'a': { button: 6, name: 'Left' },    // Button 6 = Left
        'd': { button: 7, name: 'Right' },   // Button 7 = Right
        'g': { button: 1, name: 'B' },       // Button 1 = B
        'f': { button: 0, name: 'A' },       // Button 0 = A
        'r': { button: 2, name: 'Select' },  // Button 2 = Select
        't': { button: 3, name: 'Start' }    // Button 3 = Start
      };

      document.addEventListener('keydown', (e) => {
        if (!nes) return;
        const key = e.key.toLowerCase();
        const mapping = keyToButton[key];
        if (mapping) {
          e.preventDefault(); // Prevent default browser behavior
          nes.set_button(1, mapping.button, true);
        }
      });

      document.addEventListener('keyup', (e) => {
        if (!nes) return;
        const key = e.key.toLowerCase();
        const mapping = keyToButton[key];
        if (mapping) {
          e.preventDefault();
          nes.set_button(1, mapping.button, false);
        }
      });

      // Screen size controls
      const screenMinusBtn = document.getElementById("screen-minus");
      const screenPlusBtn = document.getElementById("screen-plus");
      const fullscreenBtn = document.getElementById("fullscreen");
      
      // NES native resolution is 256x240 pixels
      const NES_ASPECT_RATIO = 256 / 240;
      const SCALE_STEP = 120; // Change height by 120px each step
      const INITIAL_HEIGHT = 720; // Initial display height in pixels
      let currentHeight = INITIAL_HEIGHT;

      function updateCanvasSize(newHeight) {
        currentHeight = Math.max(240, Math.min(newHeight, 1440)); // Clamp between 240 and 1440
        const newWidth = Math.round(currentHeight * NES_ASPECT_RATIO);
        canvas.style.width = `${newWidth}px`;
        canvas.style.height = `${currentHeight}px`;
      }

      // Update fullscreen button text based on state
      function updateFullscreenButton() {
        fullscreenBtn.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
      }

      // Set initial canvas size and button text
      updateCanvasSize(INITIAL_HEIGHT);
      updateFullscreenButton();

      screenMinusBtn.addEventListener("click", () => {
        updateCanvasSize(currentHeight - SCALE_STEP);
      });

      screenPlusBtn.addEventListener("click", () => {
        updateCanvasSize(currentHeight + SCALE_STEP);
      });

      fullscreenBtn.addEventListener("click", async () => {
        if (!document.fullscreenElement) {
          try {
            await canvas.requestFullscreen();
          } catch (err) {
            console.error("Failed to enter fullscreen:", err);
            setStatus("Failed to enter fullscreen mode", true);
          }
        } else {
          try {
            await document.exitFullscreen();
          } catch (err) {
            console.error("Failed to exit fullscreen:", err);
            setStatus("Failed to exit fullscreen mode", true);
          }
        }
      });

      // Filter toggle button
      const filterToggleBtn = document.getElementById("filter-toggle");
      
      function updateFilterButton(filterName) {
        if (filterToggleBtn) {
          // Convert filter name to friendly format
          const friendlyName = filterName
            .replace(/-/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase());
          filterToggleBtn.textContent = `Filter: ${friendlyName}`;
        }
      }
      
      if (filterToggleBtn) {
        filterToggleBtn.addEventListener("click", () => {
          if (nes && useFilters) {
            try {
              const newFilterName = nes.cycle_filter();
              updateFilterButton(newFilterName);
              setStatus(`Filter: ${newFilterName}`);
            } catch (err) {
              console.error("Failed to cycle filter:", err);
              setStatus("Failed to switch filter", true);
            }
          }
        });
      }

      function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gamepad = selectPrimaryGamepad(gamepads);
        if (!gamepad || !gamepad.connected) {
          return;
        }
        const state = mapStandardGamepadState(gamepad);
        applyGamepadState(state);
      }

      function applyGamepadState(state) {
        if (!nes) return;
        if (state.a !== lastGamepadState.a) {
          nes.set_button(1, 0, state.a);
        }
        if (state.b !== lastGamepadState.b) {
          nes.set_button(1, 1, state.b);
        }
        if (state.select !== lastGamepadState.select) {
          nes.set_button(1, 2, state.select);
        }
        if (state.start !== lastGamepadState.start) {
          nes.set_button(1, 3, state.start);
        }
        if (state.up !== lastGamepadState.up) {
          nes.set_button(1, 4, state.up);
        }
        if (state.down !== lastGamepadState.down) {
          nes.set_button(1, 5, state.down);
        }
        if (state.left !== lastGamepadState.left) {
          nes.set_button(1, 6, state.left);
        }
        if (state.right !== lastGamepadState.right) {
          nes.set_button(1, 7, state.right);
        }
        lastGamepadState = state;
      }

      function resetGamepadState() {
        applyGamepadState({
          a: false,
          b: false,
          select: false,
          start: false,
          up: false,
          down: false,
          left: false,
          right: false
        });
      }

      window.addEventListener("gamepadconnected", () => {
        if (gamepadEnabled && running && !paused) {
          pollGamepad();
        }
      });

      // Handle canvas resizing when entering/exiting fullscreen
      document.addEventListener("fullscreenchange", () => {
        updateFullscreenButton();
        if (document.fullscreenElement) {
          // Entered fullscreen - calculate size to maintain aspect ratio
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const viewportAspect = viewportWidth / viewportHeight;
          
          if (viewportAspect > NES_ASPECT_RATIO) {
            // Viewport is wider, fit to height
            canvas.style.height = "100vh";
            canvas.style.width = `${viewportHeight * NES_ASPECT_RATIO}px`;
          } else {
            // Viewport is taller, fit to width
            canvas.style.width = "100vw";
            canvas.style.height = `${viewportWidth / NES_ASPECT_RATIO}px`;
          }
        } else {
          // Exited fullscreen - restore previous size
          updateCanvasSize(currentHeight);
        }
      });
    </script>
  </body>
</html>
