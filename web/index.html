<!doctype html>
<html lang="en" data-theme="steel">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NESER Web</title>
    <link rel="stylesheet" href="./main.css" />
    <link rel="stylesheet" href="./debugger.css" />
  </head>
  <body>
    <!-- DaisyUI drawer: sidebar + main content -->
    <div class="drawer lg:drawer-open">
      <input id="sidebar-toggle" type="checkbox" class="drawer-toggle" />

      <!-- Main content area -->
      <div class="drawer-content flex flex-col min-h-screen">
        <!-- Top bar -->
        <header class="app-topbar flex items-center gap-3 px-4 py-2 min-h-14 border-b">
          <!-- Hamburger for mobile/tablet -->
          <label for="sidebar-toggle" class="btn btn-ghost btn-sm lg:hidden" aria-label="Open sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          </label>
          <!-- The running game: its system and name (filled in by app.ts when a game starts) -->
          <div id="game-title" class="game-title hidden">
            <span id="game-system" class="sys-badge"></span>
            <span id="game-name" class="game-name"></span>
            <span id="game-file" class="game-file"></span>
          </div>
          <span class="flex-1"></span>
          <span id="fps-counter" class="badge badge-neutral" style="display:none"></span>
        </header>

        <!-- Canvas area -->
        <main class="flex-1 flex flex-col items-center justify-center p-4">
          <!-- Touch controls wrapper: D-pad | Canvas | Action buttons -->
          <div id="touch-controls" class="touch-controls" aria-hidden="true">
            <!-- D-pad (left of canvas) -->
            <div class="touch-dpad-area">
              <div class="touch-joystick" data-touch-zone="joystick" aria-label="Directional joystick">
                <div class="touch-joystick-base"></div>
                <div class="touch-joystick-knob"></div>
              </div>
            </div>

            <!-- Canvas (center) -->
            <div class="screen-wrap" id="screen-wrap">
              <canvas id="screen" width="256" height="240" tabindex="0"></canvas>
              <div id="rec-overlay" class="rec-overlay hidden" aria-hidden="true"></div>
              <div id="shortcut-help-overlay" class="shortcut-help-overlay hidden" aria-hidden="true"></div>
              <div id="debugger-panel" class="debugger-panel hidden" aria-label="Debugger panel"></div>
            </div>

            <!-- Action buttons (right of canvas) -->
            <div class="touch-action-area">
              <div class="touch-meta-buttons">
                <div class="touch-meta-btn" data-button="select" aria-label="Select button">SELECT</div>
                <div class="touch-meta-btn" data-button="start" aria-label="Start button">START</div>
              </div>
              <div class="touch-action-buttons">
                <div class="touch-btn touch-btn-b" data-button="b" aria-label="B button">B</div>
                <div class="touch-btn touch-btn-a" data-button="a" aria-label="A button">A</div>
              </div>
            </div>
          </div>

          <!-- The control bar: every in-game control under the picture. data-emulation-state is the
               app's lifecycle (idle|running|paused); icons and hover tips are drawn in main.css. -->
          <div id="emulation-controls" class="control-bar" role="toolbar" aria-label="Game controls" data-emulation-state="idle">
            <button id="start" class="btn btn-primary btn-sm" data-icon="play" data-tip="Start">Start</button>
            <button id="pause" class="btn btn-ghost btn-sm" data-icon="pause" data-tip="Pause or resume" aria-keyshortcuts="Space" aria-label="Pause or resume emulation">Pause</button>
            <button id="reset" class="btn btn-ghost btn-sm" data-icon="reset" data-tip="Reset" aria-keyshortcuts="Control+R" aria-label="Reset emulation">Reset</button>
            <span class="control-bar-sep" aria-hidden="true"></span>
            <div id="save-state-section" class="control-bar-group" data-save-state="empty">
              <button id="save-state" class="btn btn-ghost btn-sm" data-icon="save" data-tip="Save state" aria-keyshortcuts="F6" disabled>Save State</button>
              <button id="load-state" class="btn btn-ghost btn-sm" data-icon="load" data-tip="Load state" aria-keyshortcuts="F7" disabled>Load State</button>
            </div>
            <span class="control-bar-sep" aria-hidden="true"></span>
            <button id="stop" class="btn btn-ghost btn-sm" data-icon="eject" data-tip="Eject the game" aria-label="Eject game">Eject</button>
            <span class="control-bar-sep" aria-hidden="true"></span>
            <div class="control-bar-group">
              <button id="screen-minus" class="btn btn-ghost btn-sm btn-icon-only" data-icon="zoom-out" data-tip="Zoom out">Zoom -</button>
              <button id="screen-plus" class="btn btn-ghost btn-sm btn-icon-only" data-icon="zoom-in" data-tip="Zoom in">Zoom +</button>
              <button id="filter-toggle" class="btn btn-ghost btn-sm" data-icon="filter" data-tip="Next filter" aria-keyshortcuts="F4">Filter</button>
              <button id="palette-cycle" class="btn btn-ghost btn-sm whitespace-nowrap" data-icon="palette" data-tip="Next palette" aria-keyshortcuts="F8" style="display: none">Palette</button>
              <button id="cgb-color-toggle" class="btn btn-ghost btn-sm" data-icon="palette" data-tip="Colour correction" aria-keyshortcuts="F8" style="display: none">Colors: Raw</button>
              <div class="volume-control">
                <button id="mute" class="btn btn-ghost btn-sm btn-icon-only" data-icon="volume" data-tip="Mute" aria-pressed="false">Mute</button>
                <input id="volume" type="range" min="0" max="100" value="100" class="range range-xs" aria-label="Volume" />
              </div>
              <button id="fullscreen" class="btn btn-ghost btn-sm btn-icon-only" data-icon="fullscreen" data-tip="Fullscreen" aria-keyshortcuts="Control+F">Fullscreen</button>
            </div>
          </div>

          <div class="mt-3 flex items-center gap-2">
            <span id="status" class="status-line"></span>
            <span class="help-hint touch-hide">Press <kbd class="kbd kbd-sm">H</kbd> for keyboard shortcuts</span>
          </div>
        </main>

        <!-- Footer removed -->
      </div>

      <!-- Sidebar -->
      <div class="drawer-side z-40">
        <label for="sidebar-toggle" class="drawer-overlay" aria-label="Close sidebar"></label>
        <aside class="app-sidebar w-68 min-h-screen border-r flex flex-col p-4 gap-4">
          <!-- Logo: steel mark, wordmark and the systems NESER runs -->
          <div class="neser-logo select-none">
            <div class="neser-logo-mark" aria-hidden="true">N</div>
            <div>
              <div class="neser-logo-word">NESER</div>
              <div class="neser-logo-systems">NES · GB · GBC · GBA · SNES</div>
            </div>
          </div>

          <!-- ROM controls -->
          <div class="flex flex-col gap-2">
            <label for="rom" class="label text-xs">ROM file</label>
            <input type="file" id="rom" class="file-input file-input-bordered file-input-sm w-full" />
            <select id="rom-select" class="select select-bordered select-sm w-full" aria-label="Select ROM from server">
              <option value="">Select bundled ROM…</option>
            </select>
          </div>

          <!-- The console original Game Boy games run on, remembered in this browser (nr-zdy.4) -->
          <div class="flex flex-col gap-2">
            <label for="gb-hardware" class="label text-xs font-bold p-0">Game Boy games run on</label>
            <select id="gb-hardware" class="select select-bordered select-sm w-full">
              <option value="dmg">Game Boy</option>
              <option value="cgb">Game Boy Color</option>
            </select>
            <span id="gb-hardware-note" class="text-xs opacity-60 hidden">Applies when you press Reset</span>
          </div>

          <!-- SNES firmware: one row per chip with a file stored in this browser (nr-auv, nr-608) -->
          <div id="snes-firmware-section" class="hidden flex flex-col gap-2">
            <span class="label text-xs font-bold p-0">SNES firmware</span>
            <div id="snes-firmware-rows" class="flex flex-col gap-1"></div>
            <input type="file" id="snes-firmware-replace-file" class="hidden" aria-label="Replacement SNES firmware file" />
          </div>

          <!-- Autorun controls -->
          <div id="autorun-section" class="flex flex-col gap-2">
            <label class="label cursor-pointer justify-start gap-2 p-0">
              <input type="checkbox" id="autorun-create" class="checkbox checkbox-sm" disabled />
              <span class="label-text text-xs">Create autorun</span>
            </label>
            <button id="autorun-load" class="btn btn-outline btn-sm w-full" disabled>Load autorun</button>
            <ul id="autorun-status" class="text-xs text-info list-none space-y-0.5"></ul>
            <button id="autorun-cancel" class="btn btn-error btn-outline btn-sm w-full hidden" aria-label="Cancel autorun">✕ Cancel Autorun</button>
          </div>

          <!-- Spacer to push content up -->
          <div class="flex-1"></div>
        </aside>
      </div>
    </div>

    <!-- Autorun modal dialog (native dialog element) -->
    <dialog id="autorun-modal" class="modal" aria-labelledby="autorun-modal-label">
      <div class="modal-box">
        <h3 class="text-lg font-bold" id="autorun-modal-label">Configure Autorun</h3>
        <div class="mt-4 flex flex-col gap-3">
          <div>
            <label for="autorun-file-input" class="label text-sm">Autorun file (.autorun)</label>
            <input type="file" id="autorun-file-input" accept=".autorun" class="file-input file-input-bordered file-input-sm w-full" />
          </div>
          <div id="autorun-file-info" class="hidden">
            <div class="alert alert-info text-sm" id="autorun-file-summary"></div>
            <div class="mt-2">
              <label for="autorun-checkpoint-select" class="label text-sm">Start from checkpoint</label>
              <select id="autorun-checkpoint-select" class="select select-bordered select-sm w-full">
                <option value="-1">From the beginning</option>
              </select>
            </div>
            <label class="label cursor-pointer justify-start gap-2 mt-2">
              <input type="checkbox" id="autorun-extend-check" class="checkbox checkbox-sm" />
              <span class="label-text text-sm">Extend autorun (record after playback ends)</span>
            </label>
          </div>
        </div>
        <div class="modal-action">
          <button type="button" id="autorun-modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="button" id="autorun-use-btn" class="btn btn-primary" disabled>Use Autorun</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- SNES firmware dialog: asks once for a chip's firmware; the words are set per chip (nr-auv, nr-608) -->
    <dialog id="snes-firmware-modal" class="modal" aria-labelledby="snes-firmware-title" aria-describedby="snes-firmware-text">
      <div class="modal-box">
        <h3 class="text-lg font-bold" id="snes-firmware-title">This game needs the DSP-1 firmware</h3>
        <p class="mt-3 text-sm" id="snes-firmware-text">Choose your dsp1b.rom file (8 KB). It stays in this browser, so you only do this once.</p>
        <input type="file" id="snes-firmware-file" class="hidden" aria-label="SNES firmware file" />
        <div class="modal-action">
          <button type="button" id="snes-firmware-cancel" class="btn btn-ghost">Cancel</button>
          <button type="button" id="snes-firmware-choose" class="btn btn-primary" autofocus>Choose file…</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
