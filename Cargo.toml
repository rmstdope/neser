[package]
name = "neser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
bitflags = "2.9"
crc = "3.3"
pixels = "0.15"
rand = "0.9.2"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdl2 = { version = "0.37", optional = true, features = ["ttf"] }
winit = "0.28"
gl = { version = "0.14", optional = true }
imgui-opengl-renderer = { version = "0.12.1", optional = true }
glow = { version = "0.14", optional = true }
librashader = { version = "0.5", optional = true, default-features = false, features = ["runtime-gl", "presets", "stable"] }
png = "0.17"
wasm-bindgen = { version = "0.2.108", optional = true }
wasm-bindgen-futures = { version = "0.4.45", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window"] }
wasm-bindgen-test = { version = "0.3.45", optional = true }
imgui = { version = "0.11", optional = true }

[features]
default = []
sdl = [
	"dep:sdl2",
	"dep:gl",
	"dep:glow",
	"dep:imgui",
	"dep:imgui-opengl-renderer",
	"dep:librashader",
]
wasm = [
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:console_error_panic_hook",
	"dep:js-sys",
	"dep:web-sys",
	"dep:wasm-bindgen-test",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[[bin]]
name = "neser"
path = "src/main.rs"
required-features = ["sdl"]

[[bin]]
name = "joysticks"
path = "src/bin/joysticks.rs"
required-features = ["sdl"]

[[bin]]
name = "autorunner"
path = "src/bin/autorunner.rs"
required-features = ["sdl"]

[dev-dependencies]
hound = "3.5"
serial_test = "3.2"
tempfile = "3.24.0"

# Improve runtime performance in debug builds (helps reduce audio underruns) while
# keeping debuggability. This is a common setup for emulator-style workloads.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
