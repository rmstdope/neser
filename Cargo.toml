[package]
name = "neser"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.9"
pixels = "0.13"
rand = "0.9.2"
ringbuf = "0.4"
sdl2 = { version = "0.37", optional = true, features = ["ttf"] }
winit = "0.28"
imgui = "0.11"
gl = { version = "0.14", optional = true }
imgui-opengl-renderer = { version = "0.12.1", optional = true }
glow = { version = "0.14", optional = true }
librashader = { version = "0.5", optional = true, default-features = false, features = ["runtime-gl", "presets", "stable"] }

[features]
default = []
sdl = [
	"dep:sdl2",
	"dep:gl",
	"dep:glow",
	"dep:imgui-opengl-renderer",
	"dep:librashader",
]

[[bin]]
name = "neser"
path = "src/main.rs"
required-features = ["sdl"]

[dev-dependencies]
serial_test = "3.2"
png = "0.17"
tempfile = "3.24.0"

# Improve runtime performance in debug builds (helps reduce audio underruns) while
# keeping debuggability. This is a common setup for emulator-style workloads.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
