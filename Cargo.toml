[package]
name = "neser"
version = "0.1.0"
edition = "2024"

[dependencies]
pixels = "0.13"
rand = "0.9.2"
sdl2 = { version = "0.37", optional = true }
winit = "0.28"

[features]
default = []
sdl = ["dep:sdl2"]

[[bin]]
name = "neser"
path = "src/main.rs"
required-features = ["sdl"]

[dev-dependencies]
serial_test = "3.2"

# Improve runtime performance in debug builds (helps reduce audio underruns) while
# keeping debuggability. This is a common setup for emulator-style workloads.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
