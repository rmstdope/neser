# What is true about THIS project, read one key at a time by .cerebro/cerebro/scripts/project-conf.
# Written by .cerebro/cerebro/scripts/install from its interview, and edited by hand after that.
# Tracked, so every clone runs on the same declaration.
#
# `key value', one per line, the value running to the end of the line. Everything from a `#' on
# is a comment, wherever it starts, so a value can never contain one. An absent key is a default.

project_name   neser
default_branch main

# What the agents call the people who use the application.
audience_noun  player

# A regex: which changed paths those people could see. Required - without it the fleet refuses to
# classify a change rather than guess.
app_paths      ^(src|web|scripts|shaders|assets)/

# What an implementer runs before it opens a pull request, and what a pull request is judged by.
# An implementer does not start until gate_fast is declared (or detected from a package.json,
# Makefile or Cargo.toml): with no gate there is nothing to be green.
gate_fast      ./scripts/gate-full.sh --fast
gate_full      ./scripts/gate-full.sh

# What installs dependencies into a fresh worktree. Detected from a lockfile when absent.
install_shell  git config core.hooksPath .githooks && git submodule update --init --recursive && npm ci && { perl -e 'alarm 300; exec @ARGV' npx playwright install --only-shell chromium || echo "install: Playwright's browser did not install within 5 minutes; only the web integration suite needs it" >&2; } && ./scripts/setup-venv.sh
# The step before setup-venv.sh (which scripts/test_gate_venv.py wants last) installs the
# headless shell @playwright/test's pinned revision needs, into the machine-wide Playwright cache,
# so the web integration suite runs in any prepared tree (nr-bsr).
# It is non-fatal and bounded (perl's alarm, since macOS has no `timeout'): a host that cannot
# reach the Playwright CDN, or an install stuck elsewhere holding Playwright's cache lock, still
# prepares trees for every bead that does not run that suite.

# Everything below is optional and off. Uncomment a line to declare it.

# Building
#install_shell           <bash fragment>      # `install' as a shell fragment, when one argv is not enough
#prewarm                 <command>            # a build run once ahead of a session; never detected
rust_paths              ^(src/|assets/|roms/|\.cargo/|Cargo\.(toml|lock)$|build\.rs$|rust-toolchain\.toml$)
# A regex: which changed paths need a Cargo build, read by build-workload --classify (nr-9gj).
# assets/ is compiled in (include_bytes! of the UI font); roms/ is proved only by cargo tests
# (and build.rs reads roms/games/mappers). shaders/ and vendor/ are loaded at runtime, so not here.
#disk_floor_gb           2                    # GB free below which no bead starts; absent: no disk preflight
#disk_floor_non_rust_gb  1                    # the same floor when the change needs no Cargo build
#reclaim_dirs            target               # directories the disk preflight and the worktree pruner may reclaim
#cargo_reclaim_packages  <package>            # packages `cargo clean --package' may reclaim

# Verifying: how the verifier starts what a person can look at
#launch_targets          web                  # the targets, space-separated; absent: the verifier asks
#launch_web              npm run dev          # the command for each target, `launch_<target>' ...
#launch_web_port         3000                 # ... and the port it serves on, `launch_<target>_port'
launch_targets          desktop              # the native frontend; the ROM path is appended
launch_desktop          cargo run --release --bin neser --
#verification            none                 # nothing here can be looked at (a library, a tool)
#verification_skill      <skill>              # a skill the verifier loads before it prepares anything
#fixtures_doc            docs/fixtures.md     # where the verifier reads which fixtures exist

# Ports: one block per worktree, so parallel implementers' servers never collide
port_base               8100                 # the first port of the first block
port_block_size         10                   # ports per block
port_env                NESER_WEB_PORT       # read by playwright.config.ts and scripts/run_web.sh

# The fleet
#role_start_spacing_implementer 30            # seconds between two starts of one role; 0 never spaces it
#planner_buffer_multiple 1                    # planned beads wanted per implementer
#retro_dir               docs/retrospectives  # where retrospectives live, read by retro-sightings

# Delivery: how the fleet tells that a bead's work reached the default branch
#commit_ref_pattern      ({id}):              # how a commit subject names its bead
#non_delivery_commit_pattern <regex>          # subjects that are not deliveries (a planner's mockup commit)
#merged_check            gh                   # how a worktree's branch is judged landed when its commits are not on origin
