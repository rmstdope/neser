# The fleet THIS project runs, written by .cerebro/cerebro/scripts/install and edited by hand.
# NAME  ROLE  [autostart|standby]: one agent per line, the interactive roles first, then the
# implementers. Order is load-bearing - implementers are taken in file order. `autostart' is
# started as the fleet view opens; `standby' is armed and started by its role's trigger; no
# third word means you start it with `s'. The roles are the files in .cerebro/cerebro/agents/.

Cerebro        orchestrator   autostart
Xavier         ux             standby
Psylocke       verifier       standby
Moira          user-feedback  standby
Forge          architect
Cyclops        implementer    standby
Storm          implementer    standby
