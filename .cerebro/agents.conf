# What each agent runs on: which tool, which model, how hard it thinks.
# See .claude/cerebro/agents.conf.example for the shape.

external glm-5.3-flash openai https://openrouter.ai/api/v1 ${OPENROUTER_API_KEY} z-ai/glm-5.3-flash

default      tool=claude  model=opus   effort=medium
verifier     tool=claude  model=opus   effort=medium
architect    tool=claude  model=opus   effort=high

