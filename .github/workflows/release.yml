name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    uses: rmstdope/neser/.github/workflows/ci.yml@main

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: neser
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: neser
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: neser
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: neser.exe

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install native dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --features native --target ${{ matrix.target }}

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: neser-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/neser

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: neser-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/neser.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for git-cliff to generate complete changelog
          submodules: true

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mv artifacts/neser-x86_64-unknown-linux-gnu/neser artifacts/neser-linux-x86_64
          mv artifacts/neser-x86_64-apple-darwin/neser artifacts/neser-macos-x86_64
          mv artifacts/neser-aarch64-apple-darwin/neser artifacts/neser-macos-aarch64
          cd artifacts/neser-x86_64-pc-windows-msvc && zip -r ../neser-windows-x86_64.zip . && cd ../..

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff -l --strip header --github-repo rmstdope/neser --output RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/neser-linux-x86_64
            artifacts/neser-macos-x86_64
            artifacts/neser-macos-aarch64
            artifacts/neser-windows-x86_64.zip
          body_path: RELEASE_NOTES.md
          make_latest: true

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Publish
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
