name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    uses: rmstdope/neser/.github/workflows/ci.yml@main

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: neser
            archive_format: tar.gz
            verify_flags: --require-unix-executable
            smoke_binary: ./neser
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: neser
            archive_format: tar.gz
            verify_flags: --require-unix-executable
            smoke_binary: ./neser
          - os: macos-14
            target: aarch64-apple-darwin
            binary: neser
            archive_format: tar.gz
            verify_flags: --require-unix-executable
            smoke_binary: ./neser
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: neser.exe
            archive_format: zip
            verify_flags: ""
            smoke_binary: ./neser.exe

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install native dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --features native --target ${{ matrix.target }}

      - name: Package release archive
        run: >
          python scripts/package_release.py
          --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
          --output-dir dist
          --target ${{ matrix.target }}
          --format ${{ matrix.archive_format }}
          --binary-name ${{ matrix.binary }}

      - name: Verify release archive
        run: >
          python scripts/verify_release_package.py
          dist/neser-${{ matrix.target }}.${{ matrix.archive_format }}
          --binary-name ${{ matrix.binary }}
          ${{ matrix.verify_flags }}
          --smoke-command ${{ matrix.smoke_binary }} --version

      - name: Upload release archive
        uses: actions/upload-artifact@v5
        with:
          name: neser-${{ matrix.target }}
          path: dist/neser-${{ matrix.target }}.${{ matrix.archive_format }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for git-cliff to generate complete changelog
          submodules: true

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff -l --strip header --github-repo "${{ github.repository }}" --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body_path: RELEASE_NOTES.md
          make_latest: true

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Publish
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
