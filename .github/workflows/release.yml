name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    uses: rmstdope/neser/.github/workflows/ci.yml@main

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: neser
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: neser
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: neser
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: neser.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install SDL2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Install SDL2 (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install sdl2 sdl2_ttf

      - name: Install SDL2 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $SDL2_VERSION = "2.30.9"
          $SDL2_TTF_VERSION = "2.24.0"

          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-devel-$SDL2_VERSION-VC.zip" -OutFile SDL2-devel.zip
          Expand-Archive SDL2-devel.zip -DestinationPath C:\SDL2

          Invoke-WebRequest "https://github.com/libsdl-org/SDL_ttf/releases/download/release-$SDL2_TTF_VERSION/SDL2_ttf-devel-$SDL2_TTF_VERSION-VC.zip" -OutFile SDL2_ttf-devel.zip
          Expand-Archive SDL2_ttf-devel.zip -DestinationPath C:\SDL2_ttf

          echo "SDL2_LIB_DIR=C:\SDL2\SDL2-$SDL2_VERSION\lib\x64" >> $env:GITHUB_ENV
          echo "SDL2_TTF_LIB_DIR=C:\SDL2_ttf\SDL2_ttf-$SDL2_TTF_VERSION\lib\x64" >> $env:GITHUB_ENV
          echo "SDL2_INCLUDE_DIR=C:\SDL2\SDL2-$SDL2_VERSION\include" >> $env:GITHUB_ENV
          # Make the .lib files visible to the MSVC linker
          echo "LIB=C:\SDL2\SDL2-$SDL2_VERSION\lib\x64;C:\SDL2_ttf\SDL2_ttf-$SDL2_TTF_VERSION\lib\x64" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --features sdl --target ${{ matrix.target }}

      - name: Bundle Windows DLLs
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $SDL2_VERSION = "2.30.9"
          $SDL2_TTF_VERSION = "2.24.0"
          Copy-Item "C:\SDL2\SDL2-$SDL2_VERSION\lib\x64\SDL2.dll" "target\${{ matrix.target }}\release\"
          Copy-Item "C:\SDL2_ttf\SDL2_ttf-$SDL2_TTF_VERSION\lib\x64\SDL2_ttf.dll" "target\${{ matrix.target }}\release\"

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: neser-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/neser

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: neser-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/neser.exe
            target/${{ matrix.target }}/release/SDL2.dll
            target/${{ matrix.target }}/release/SDL2_ttf.dll

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mv artifacts/neser-x86_64-unknown-linux-gnu/neser artifacts/neser-linux-x86_64
          mv artifacts/neser-x86_64-apple-darwin/neser artifacts/neser-macos-x86_64
          mv artifacts/neser-aarch64-apple-darwin/neser artifacts/neser-macos-aarch64
          cd artifacts/neser-x86_64-pc-windows-msvc && zip -r ../neser-windows-x86_64.zip . && cd ../..

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --output RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/neser-linux-x86_64
            artifacts/neser-macos-x86_64
            artifacts/neser-macos-aarch64
            artifacts/neser-windows-x86_64.zip
          body_path: RELEASE_NOTES.md
          make_latest: true

