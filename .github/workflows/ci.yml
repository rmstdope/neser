name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_integration: ${{ steps.filter.outputs.web_integration }}

    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/rust.yml'
            web_integration:
              - 'web/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/build_web.sh'
              - 'scripts/run_web.sh'
              - 'playwright.config.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/rust.yml'

  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Run tests
        run: cargo test --lib --bins --tests --examples

  rust-lint-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Run clippy (PR fast path)
        run: cargo clippy --all-features
      - name: Check formatting
        run: cargo fmt -- --check

  rust-lint-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Run clippy (main full coverage)
        run: cargo clippy --all-targets --all-features
      - name: Check formatting
        run: cargo fmt -- --check

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Test WASM frontend
        run: wasm-pack test --headless --chrome -- --features wasm

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test web frontend
        run: npm ci && npm test

  web-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web_integration == 'true'

    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run web integration tests
        run: npm run test:integration:web
