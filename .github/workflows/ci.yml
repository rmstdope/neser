name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_integration: ${{ steps.filter.outputs.web_integration }}
      python: ${{ steps.filter.outputs.python }}
      shader_assets: ${{ steps.filter.outputs.shader_assets }}
      rust: ${{ steps.filter.outputs.rust }}
      nes: ${{ steps.filter.outputs.nes }}
      gb: ${{ steps.filter.outputs.gb }}
      gba: ${{ steps.filter.outputs.gba }}
      snes: ${{ steps.filter.outputs.snes }}
      nes_test_assets: ${{ steps.filter.outputs.nes_test_assets }}
      gb_test_assets: ${{ steps.filter.outputs.gb_test_assets }}
      gba_test_assets: ${{ steps.filter.outputs.gba_test_assets }}
      snes_test_assets: ${{ steps.filter.outputs.snes_test_assets }}
      test_assets: ${{ steps.filter.outputs.nes_test_assets == 'true' || steps.filter.outputs.gb_test_assets == 'true' || steps.filter.outputs.gba_test_assets == 'true' || steps.filter.outputs.snes_test_assets == 'true' }}
      platform: ${{ steps.filter.outputs.platform }}
      root_rust: ${{ steps.filter.outputs.root_rust }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            web_integration:
              - 'web/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/build_web.sh'
              - 'scripts/run_web.sh'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            python:
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            shader_assets:
              # Release packaging only ships shader files reachable from the
              # presets in src/platform/shaders.rs, so anything that can change
              # that graph must re-run the reachability and exact-case tests in
              # scripts/test_package_release.py. That means the preset list, the
              # vendored presets, and the local ones under shaders/ — which
              # SHADER_PRESETS also points at (stock.slangp, gba-lcd.slangp).
              # The bare vendor path detects submodule (gitlink) pointer bumps.
              # See docs/VENDOR_SUBMODULES.md.
              - 'vendor/slang-shaders'
              - 'shaders/**'
              - 'src/platform/shaders.rs'
              - '.github/workflows/ci.yml'
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            nes:
              - 'src/nes/**'
            gb:
              - 'src/gb/**'
            gba:
              - 'src/gba/**'
            snes:
              - 'src/snes/**'
            nes_test_assets:
              - 'roms/nes/automated_tests/**'
            gb_test_assets:
              - 'roms/gb/automated_tests/**'
            gba_test_assets:
              - 'roms/gba/automated_tests/**'
            snes_test_assets:
              # Bare path entry detects submodule (gitlink) pointer bumps.
              - 'roms/snes/automated_tests/snes_test_roms'
              - 'roms/snes/automated_tests/**'
            platform:
              - 'src/platform/**'
            root_rust:
              - 'src/lib.rs'
              - 'src/main.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'

  python-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true'
      || needs.changes.outputs.shader_assets == 'true'
      || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Pinned so the lint/format/type gates below are reproducible; a
          # floating "3.x" lets an interpreter bump break an unrelated PR.
          python-version: "3.14"
      - name: Ensure pip supports dependency groups
        # The install below uses PEP 735 `--group`, which needs pip >= 25.1.
        # Runner images currently ship a newer pip, but that is not a guarantee:
        # without this floor an image rollback would fail the job on an
        # unrelated PR with a confusing "no such option" error.
        run: python -m pip install --upgrade "pip>=25.1"
      - name: Install Python tooling and test dependencies
        # Dependency groups live in scripts/pyproject.toml.
        run: >
          python -m pip install
          --group scripts/pyproject.toml:test
          --group scripts/pyproject.toml:dev
      - name: Lint Python (ruff)
        run: ruff check scripts
      - name: Check Python formatting (ruff)
        run: ruff format --check scripts
      - name: Type-check Python (mypy)
        # mypy does not discover config by walking up, so point it at the file.
        run: mypy --config-file scripts/pyproject.toml scripts
      - name: Run Python tests
        run: python -m unittest discover -s scripts -t . -p "test_*.py"

  # Build the test binaries once and archive them so the sharded run jobs below
  # can execute partitions of the suite in parallel without recompiling the
  # ~382k-line crate four times (canonical cargo-nextest archive pattern).
  rust-test-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.test_assets == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install native frontend system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev && break
            echo "apt attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build and archive tests
        run: cargo nextest archive --lib --all-features --archive-file nextest-archive.tar.zst
      - name: Upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  # Run the archived tests across 4 parallel shards. Path-based filtering is
  # preserved exactly (validated locally against the previous cargo-test
  # filters) so partial-change PRs still skip unrelated suites.
  rust-test-run:
    runs-on: ubuntu-latest
    needs: [changes, rust-test-build]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.test_assets == 'true' || github.event_name == 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install native frontend system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev && break
            echo "apt attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: .
      - name: Compute test filter from changed paths
        id: test-filter
        env:
          CHANGED_NES: ${{ needs.changes.outputs.nes }}
          CHANGED_GB: ${{ needs.changes.outputs.gb }}
          CHANGED_GBA: ${{ needs.changes.outputs.gba }}
          CHANGED_SNES: ${{ needs.changes.outputs.snes }}
          CHANGED_NES_TEST_ASSETS: ${{ needs.changes.outputs.nes_test_assets }}
          CHANGED_GB_TEST_ASSETS: ${{ needs.changes.outputs.gb_test_assets }}
          CHANGED_GBA_TEST_ASSETS: ${{ needs.changes.outputs.gba_test_assets }}
          CHANGED_SNES_TEST_ASSETS: ${{ needs.changes.outputs.snes_test_assets }}
          CHANGED_PLATFORM: ${{ needs.changes.outputs.platform }}
          CHANGED_ROOT: ${{ needs.changes.outputs.root_rust }}
        run: |
          # platform or root changes are cross-cutting: run the whole suite.
          if [[ "$CHANGED_PLATFORM" == "true" || "$CHANGED_ROOT" == "true" ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "Running all tests (platform or root change detected)"
          else
            FILTER=""
            [[ "$CHANGED_NES" == "true" || "$CHANGED_NES_TEST_ASSETS" == "true" ]] && FILTER="${FILTER} nes::"
            [[ "$CHANGED_GB" == "true" || "$CHANGED_GB_TEST_ASSETS" == "true" ]] && FILTER="${FILTER} gb::"
            [[ "$CHANGED_GBA" == "true" || "$CHANGED_GBA_TEST_ASSETS" == "true" ]] && FILTER="${FILTER} gba::"
            [[ "$CHANGED_SNES" == "true" || "$CHANGED_SNES_TEST_ASSETS" == "true" ]] && FILTER="${FILTER} snes::"
            FILTER="$(echo "$FILTER" | xargs)"
            if [[ -n "$FILTER" ]]; then
              echo "mode=filter" >> "$GITHUB_OUTPUT"
              echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"
              echo "Filtered run: '${FILTER}' (includes those areas' integration tests)"
            else
              # Rust changed but no area filter matched (e.g. frontends):
              # run all unit tests but skip every console's integration tests,
              # mirroring scripts/test-dir.sh --skip-integration.
              echo "mode=unit" >> "$GITHUB_OUTPUT"
              echo "filter=" >> "$GITHUB_OUTPUT"
              echo "Running all unit tests (excluding NES/GB/GBA/SNES integration)"
            fi
          fi
      - name: Run tests (shard ${{ matrix.shard }}/4)
        env:
          MODE: ${{ steps.test-filter.outputs.mode }}
          FILTER: ${{ steps.test-filter.outputs.filter }}
          SHARD: ${{ matrix.shard }}
        run: |
          PARTITION="count:${SHARD}/4"
          ARCHIVE="--archive-file nextest-archive.tar.zst --workspace-remap ."
          if [[ "$MODE" == "all" ]]; then
            cargo nextest run $ARCHIVE --partition "$PARTITION"
          elif [[ "$MODE" == "filter" ]]; then
            # $FILTER intentionally word-splits into positional substring filters.
            cargo nextest run $ARCHIVE --partition "$PARTITION" $FILTER
          else
            cargo nextest run $ARCHIVE --partition "$PARTITION" \
              -E 'not (test(nes::integration_tests) | test(gb::integration_tests) | test(gba::integration_tests) | test(snes::integration_tests))'
          fi

  # One lint job for every event. This deliberately has no `if:` and no
  # `needs: changes`: it is a required status check, so it must report on every
  # PR, including docs-only ones. A required check that is skipped may never
  # report and can leave a PR waiting for a status that never arrives.
  #
  # It replaces an earlier rust-lint-pr / rust-lint-main split whose PR half ran
  # a weaker command. Every test in this crate lives in an inline #[cfg(test)]
  # module, so without --all-targets clippy compiles no test code at all and
  # cannot see lints there -- which is how #3095 landed one (closes #3103).
  rust-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install native frontend system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev && break
            echo "apt attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        # Must stay byte-identical to the pre-merge checkpoint in
        # .github/copilot-instructions.md and the README "Useful checks" block.
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      # wasm-pack installs the target itself, but the clippy step below runs
      # first so a lint failure reports without waiting on a browser run.
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Lint wasm target (clippy)
        # The host rust-lint job runs --all-features on the host triple, which
        # covers the `wasm` feature but never the `wasm32` architecture. Without
        # this step nothing lints src/frontends/web/wasm_tests.rs (1447 lines) or
        # any #[cfg(target_arch = "wasm32")] arm.
        #
        # --all-features cannot be used here: the `native` feature pulls rusqlite
        # (which cc-compiles a bundled sqlite3.c), alsa-sys, libudev-sys, ring and
        # wayland-sys, none of which build for wasm32. --no-default-features
        # --features wasm is the configuration every other wasm invocation in this
        # repo uses. Do not set RUSTFLAGS here either: it would override
        # .cargo/config.toml's [target.wasm32-unknown-unknown] rustflags.
        #
        # Kept on one line, unfolded, so it stays byte-identical to the copies in
        # .github/copilot-instructions.md, README.md and bug-of-the-day.md and a
        # plain grep can verify they still agree.
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features wasm --all-targets -- -D warnings
      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.14.0"
      - name: Test WASM frontend
        run: wasm-pack test --headless --chrome --no-default-features --features wasm

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test web frontend
        run: npm ci && npm test

  web-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.web_integration == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "Playwright install attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            npx playwright install-deps chromium && break
            echo "Playwright install-deps attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Build WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --no-default-features --features wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/neser.wasm --out-dir web/pkg --target web --omit-default-module-path --no-typescript
      - name: Run web integration tests
        run: npm run test:integration:web
