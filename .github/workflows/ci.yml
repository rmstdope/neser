name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_integration: ${{ steps.filter.outputs.web_integration }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      nes: ${{ steps.filter.outputs.nes }}
      gb: ${{ steps.filter.outputs.gb }}
      gba: ${{ steps.filter.outputs.gba }}
      gba_test_assets: ${{ steps.filter.outputs.gba_test_assets }}
      platform: ${{ steps.filter.outputs.platform }}
      root_rust: ${{ steps.filter.outputs.root_rust }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/rust.yml'
            web_integration:
              - 'web/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/build_web.sh'
              - 'scripts/run_web.sh'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/rust.yml'
            python:
              - 'scripts/**/*.py'
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            nes:
              - 'src/nes/**'
            gb:
              - 'src/gb/**'
            gba:
              - 'src/gba/**'
            gba_test_assets:
              - 'roms/gba/automated_tests/gba-tests'
              - 'roms/gba/automated_tests/gba-tests/**'
            platform:
              - 'src/platform/**'
            root_rust:
              - 'src/lib.rs'
              - 'src/main.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'

  python-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Python test dependencies
        run: python -m pip install -r scripts/requirements-test.txt
      - name: Run Python tests
        run: |
          python -m unittest discover -s scripts -t scripts -p "test_*.py" &&
          python -m unittest discover -s scripts/metadata-scraper -t scripts/metadata-scraper -p "test_*.py" &&
          python -m unittest discover -s scripts/nes-rom-db-scraper -t scripts/nes-rom-db-scraper -p "test_*.py"

  rust-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install native frontend system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev && break
            echo "apt attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build test filter from changed paths
        id: test-filter
        env:
          CHANGED_NES: ${{ needs.changes.outputs.nes }}
          CHANGED_GB: ${{ needs.changes.outputs.gb }}
          CHANGED_GBA: ${{ needs.changes.outputs.gba }}
          CHANGED_GBA_TEST_ASSETS: ${{ needs.changes.outputs.gba_test_assets }}
          CHANGED_PLATFORM: ${{ needs.changes.outputs.platform }}
          CHANGED_ROOT: ${{ needs.changes.outputs.root_rust }}
        run: |
          # If platform or root files changed, run all tests (cross-cutting deps)
          if [[ "$CHANGED_PLATFORM" == "true" || "$CHANGED_ROOT" == "true" ]]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "run_nes_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_gba_integration=true" >> "$GITHUB_OUTPUT"
            echo "Running all tests (platform or root change detected)"
          else
            FILTER=""
            RUN_NES_INTEGRATION=false
            RUN_GBA_INTEGRATION=false
            if [[ "$CHANGED_NES" == "true" ]]; then
              FILTER="${FILTER} nes::"
              RUN_NES_INTEGRATION=true
            fi
            if [[ "$CHANGED_GB" == "true" ]]; then
              FILTER="${FILTER} gb::"
            fi
            if [[ "$CHANGED_GBA" == "true" || "$CHANGED_GBA_TEST_ASSETS" == "true" ]]; then
              FILTER="${FILTER} gba::"
              RUN_GBA_INTEGRATION=true
            fi
            echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"
            echo "run_nes_integration=${RUN_NES_INTEGRATION}" >> "$GITHUB_OUTPUT"
            echo "run_gba_integration=${RUN_GBA_INTEGRATION}" >> "$GITHUB_OUTPUT"
            echo "Test filter: '${FILTER}', nes_integration: ${RUN_NES_INTEGRATION}, gba_integration: ${RUN_GBA_INTEGRATION}"
          fi

      - name: Run unit tests
        run: |
          FILTER="${{ steps.test-filter.outputs.filter }}"
          if [[ -z "$FILTER" ]]; then
            echo "Running all unit tests (no filter)"
            cargo test --lib --examples --all-features -- --skip 'nes::integration_tests' --skip 'gba::integration_tests'
          else
            echo "Running filtered unit tests: $FILTER"
            cargo test --lib --examples --all-features -- $FILTER --skip 'nes::integration_tests' --skip 'gba::integration_tests'
          fi

      - name: Run NES integration tests
        if: steps.test-filter.outputs.run_nes_integration == 'true'
        run: cargo test --lib --all-features -- 'nes::integration_tests::'

      - name: Run GBA integration tests
        if: steps.test-filter.outputs.run_gba_integration == 'true'
        run: cargo test --lib --all-features -- 'gba::integration_tests::'

  rust-lint-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install native frontend system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev && break
            echo "apt attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Run clippy (PR fast path)
        run: cargo clippy --all-features
      - name: Check formatting
        run: cargo fmt -- --check

  rust-lint-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install native frontend system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev && break
            echo "apt attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Run clippy (main full coverage)
        run: cargo clippy --all-targets --all-features
      - name: Check formatting
        run: cargo fmt -- --check

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Test WASM frontend
        run: wasm-pack test --headless --chrome --no-default-features --features wasm

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test web frontend
        run: npm ci && npm test

  web-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.web_integration == 'true' || github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "Playwright install attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            npx playwright install-deps chromium && break
            echo "Playwright install-deps attempt $i failed (transient network); retrying after 15s..." && sleep 15
          done
      - name: Build WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --no-default-features --features wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/neser.wasm --out-dir web/pkg --target web --omit-default-module-path --no-typescript
      - name: Run web integration tests
        run: npm run test:integration:web
