# m015.0_8k.cfg — K-1029 Multicart (Mapper 15, Submapper 0) — 8KB Mode Tests
# 128KB PRG-ROM (16 × 8KB pages) + 8KB CHR-RAM
# Used for testing banking modes 0, 2, 3 which require 8KB-granularity
# bank verification via RAM trampoline.
#
# Power-on: mode 0 maps pages 0-3 to $8000-$FFFF.
#   Boot code lives in pages 2-3 ($C000-$FFFF).
# After bootstrap: mode 1, fixed pages 14-15 at $C000-$FFFF.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 16 × 8KB PRG pages (128KB total = PRG_ROM_16K=8)
    PRG_P00:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P01:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P02:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P03:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P04:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P05:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P06:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P07:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P08:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P09:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P10:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P11:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P12:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P13:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P14:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P15:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Bootstrap in pages 2-3 (visible at $C000-$FFFF on power-on in mode 0)
    BOOT:      load = PRG_P02, type = ro, start = $C000;
    BOOT_VECS: load = PRG_P03, type = ro, start = $FFFA;
    # Main code in pages 14-15 (fixed at $C000-$FFFF in mode 1)
    CODE:      load = PRG_P14, type = ro, start = $C000;
    RODATA:    load = PRG_P14, type = ro;
    VECTORS:   load = PRG_P15, type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_P14, type = ro, optional = yes;
    # 8KB bank signatures — one per testable page
    # Pages 2-3 (boot) and 14-15 (code) have no signatures.
    PRG_SIG0:  load = PRG_P00, type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_P01, type = ro, optional = yes, start = $A000;
    PRG_SIG4:  load = PRG_P04, type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_P05, type = ro, optional = yes, start = $A000;
    PRG_SIG6:  load = PRG_P06, type = ro, optional = yes, start = $C000;
    PRG_SIG7:  load = PRG_P07, type = ro, optional = yes, start = $E000;
    PRG_SIG8:  load = PRG_P08, type = ro, optional = yes, start = $8000;
    PRG_SIG9:  load = PRG_P09, type = ro, optional = yes, start = $A000;
    PRG_SIG10: load = PRG_P10, type = ro, optional = yes, start = $C000;
    PRG_SIG11: load = PRG_P11, type = ro, optional = yes, start = $E000;
    PRG_SIG12: load = PRG_P12, type = ro, optional = yes, start = $8000;
    PRG_SIG13: load = PRG_P13, type = ro, optional = yes, start = $A000;
    # No CHR-ROM (CHR-RAM only)
}
