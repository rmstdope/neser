# m030.2.cfg — UNROM 512 (Mapper 30, Submapper 2) — 1-Screen mirroring control
# 256KB PRG-ROM (16 × 16KB banks) + 32KB CHR-RAM (4 × 8KB banks)
# $8000-$BFFF switchable 16KB, $C000-$FFFF fixed to last bank.
# Bit 7 of register: 0=1-screen A, 1=1-screen B.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    # 16 × 16KB PRG banks
    PRG_B0:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B8:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B9:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B10:  start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B11:  start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B12:  start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B13:  start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B14:  start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B15:  start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    CODE:      load = PRG_B15, type = ro, start = $C000;
    RODATA:    load = PRG_B15, type = ro;
    VECTORS:   load = PRG_B15, type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B15, type = ro, optional = yes;
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $8000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $8000;
}
