# m006.0_modes.cfg — Front Fareast Magic Card (Mapper 6, Submapper 0) — Mode Tests
# 128KB PRG-ROM (16 × 8KB pages) + 32KB CHR-ROM (4 × 8KB banks) + 32KB WRAM
# Used for testing GNROM mode, 2M PRG banking, write-enable, and WRAM banking,
# which require 8KB-granularity bank verification via RAM trampoline.
#
# Power-on: mode 1 (UN1ROM), pages 14-15 fixed at $C000-$FFFF.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 16 × 8KB PRG pages (128KB total = PRG_ROM_16K=8)
    PRG_P00:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P01:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P02:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P03:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P04:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P05:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P06:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P07:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P08:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P09:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P10:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P11:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P12:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P13:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Pages 14-15 = code bank (fixed at $C000-$FFFF in mode 1)
    PRG_P14:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_P15:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # 4 × 8KB CHR banks
    CHR_B0:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Main code in pages 14-15 (fixed at $C000-$FFFF in mode 1)
    CODE:      load = PRG_P14, type = ro, start = $C000;
    RODATA:    load = PRG_P14, type = ro;
    VECTORS:   load = PRG_P15, type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_P14, type = ro, optional = yes;
    # 8KB bank signatures — one per testable page
    # Pages 14-15 (code) have no signatures.
    PRG_SIG0:  load = PRG_P00, type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_P01, type = ro, optional = yes, start = $A000;
    PRG_SIG2:  load = PRG_P02, type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_P03, type = ro, optional = yes, start = $A000;
    PRG_SIG4:  load = PRG_P04, type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_P05, type = ro, optional = yes, start = $A000;
    PRG_SIG6:  load = PRG_P06, type = ro, optional = yes, start = $8000;
    PRG_SIG7:  load = PRG_P07, type = ro, optional = yes, start = $A000;
    PRG_SIG8:  load = PRG_P08, type = ro, optional = yes, start = $8000;
    PRG_SIG9:  load = PRG_P09, type = ro, optional = yes, start = $A000;
    PRG_SIG10: load = PRG_P10, type = ro, optional = yes, start = $8000;
    PRG_SIG11: load = PRG_P11, type = ro, optional = yes, start = $A000;
    PRG_SIG12: load = PRG_P12, type = ro, optional = yes, start = $8000;
    PRG_SIG13: load = PRG_P13, type = ro, optional = yes, start = $A000;
    # ASCII font in first CHR bank
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
    # CHR bank signatures
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
}
