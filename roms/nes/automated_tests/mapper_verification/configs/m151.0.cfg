# m151.0.cfg — VRC1 on VS System (Mapper 151, Submapper 0)
# 64KB PRG-ROM (8 × 8KB banks) + 16KB CHR-ROM (4 × 4KB banks) + 8KB PRG-RAM (status byte)
# Same banking layout as VRC1 (mapper 75): 3 switchable + 1 fixed PRG, 2 × 4KB CHR.
# Font placed in CHR bank 0, mapped via $E000 at startup.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 8 × 8KB PRG banks
    PRG_B0:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # 4 × 4KB CHR banks (bank 0 has font at offset $0200)
    CHR_B0:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code in last bank (fixed at $E000-$FFFF)
    CODE:      load = PRG_B7,  type = ro, start = $E000;
    RODATA:    load = PRG_B7,  type = ro;
    VECTORS:   load = PRG_B7,  type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B7, type = ro, optional = yes;
    # PRG bank signatures
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $8000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $C000;
    # CHR bank signatures
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
    # ASCII font in CHR bank 0
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
