# m040.0.cfg — NTDEC 2722 (Mapper 40, Submapper 0)
# 64KB PRG-ROM (8 × 8KB banks) + 8KB fixed CHR-ROM
# Fixed banks: 6@$6000, 4@$8000, 5@$A000, 7@$E000; $C000 is switchable.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    PRG_B0:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    CHR_B0:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    CODE:      load = PRG_B7,  type = ro, start = $E000;
    RODATA:    load = PRG_B7,  type = ro;
    VECTORS:   load = PRG_B7,  type = ro, start = $FFFA;
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $C000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $C000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $C000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $C000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $A000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $6000;
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
