# m044.0.cfg — Super Big 7-in-1 (Mapper 44, Submapper 0) — MMC3 Multicart
# 384KB PRG-ROM (48 × 8KB banks, 3 blocks) + 16KB CHR-ROM (16 × 1KB banks) + 8KB PRG-RAM
# Block 0: PRG banks 0-15, Block 1: PRG banks 16-31, Block 2: PRG banks 32-47
# Code in PRG_B15 (block 0's last bank, fixed at $E000-$FFFF).
# Font placed in CHR banks 8+9 (2KB area), mapped via R0=8 at startup.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # Block 0: PRG banks 0-15
    PRG_B0:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B8:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B9:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B10:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B11:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B12:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B13:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B14:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B15:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Block 1: PRG banks 16-31
    PRG_B16:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B17:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B18:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B19:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B20:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B21:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B22:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B23:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B24:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B25:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B26:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B27:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B28:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B29:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B30:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B31:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Block 2: PRG banks 32-47
    PRG_B32:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B33:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B34:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B35:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B36:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B37:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B38:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B39:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B40:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B41:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B42:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B43:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B44:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B45:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B46:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B47:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # 16 × 1KB CHR banks: banks 0-7 individual, 8+9 merged for font, 10-15 individual
    CHR_B0:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B4:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B5:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B6:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B7:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_FONT: start = $0000, size = $0800, type = ro, fill = yes, fillval = $00;
    CHR_B10:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B11:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B12:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B13:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B14:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B15:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:     load = HEADER,  type = ro;
    ZEROPAGE:   load = ZP,      type = zp;
    BSS:        load = RAM,     type = bss;
    # Code in last bank of block 0 (fixed at $E000-$FFFF)
    CODE:       load = PRG_B15, type = ro, start = $E000;
    RODATA:     load = PRG_B15, type = ro;
    VECTORS:    load = PRG_B15, type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B15, type = ro, optional = yes;
    # Block 0: PRG bank signatures (banks 0-14; bank 15 is code)
    PRG_SIG0:   load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:   load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:   load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:   load = PRG_B3,  type = ro, optional = yes, start = $8000;
    PRG_SIG4:   load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:   load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG6:   load = PRG_B6,  type = ro, optional = yes, start = $8000;
    PRG_SIG7:   load = PRG_B7,  type = ro, optional = yes, start = $8000;
    PRG_SIG8:   load = PRG_B8,  type = ro, optional = yes, start = $8000;
    PRG_SIG9:   load = PRG_B9,  type = ro, optional = yes, start = $8000;
    PRG_SIG10:  load = PRG_B10, type = ro, optional = yes, start = $8000;
    PRG_SIG11:  load = PRG_B11, type = ro, optional = yes, start = $8000;
    PRG_SIG12:  load = PRG_B12, type = ro, optional = yes, start = $8000;
    PRG_SIG13:  load = PRG_B13, type = ro, optional = yes, start = $8000;
    PRG_SIG14:  load = PRG_B14, type = ro, optional = yes, start = $C000;
    # Block 1: first bank signature (for block_select test)
    PRG_SIG16:  load = PRG_B16, type = ro, optional = yes, start = $8000;
    # Block 2: first bank signature (for block_select test)
    PRG_SIG32:  load = PRG_B32, type = ro, optional = yes, start = $8000;
    # CHR bank signatures
    CHR_SIG0:   load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:   load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:   load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:   load = CHR_B3,  type = ro, optional = yes;
    CHR_SIG4:   load = CHR_B4,  type = ro, optional = yes;
    CHR_SIG5:   load = CHR_B5,  type = ro, optional = yes;
    CHR_SIG6:   load = CHR_B6,  type = ro, optional = yes;
    CHR_SIG7:   load = CHR_B7,  type = ro, optional = yes;
    # SIG8/SIG9 go into CHR_FONT area (placed before font, no overlap)
    CHR_SIG8:   load = CHR_FONT, type = ro, optional = yes;
    CHR_SIG9:   load = CHR_FONT, type = ro, optional = yes;
    CHR_SIG10:  load = CHR_B10, type = ro, optional = yes;
    CHR_SIG11:  load = CHR_B11, type = ro, optional = yes;
    CHR_SIG12:  load = CHR_B12, type = ro, optional = yes;
    CHR_SIG13:  load = CHR_B13, type = ro, optional = yes;
    CHR_SIG14:  load = CHR_B14, type = ro, optional = yes;
    CHR_SIG15:  load = CHR_B15, type = ro, optional = yes;
    # ASCII font in CHR banks 8+9 (2KB area)
    CHARS:      load = CHR_FONT, type = ro, optional = yes, start = $0200;
}
