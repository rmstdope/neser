# m001.0.cfg — MMC1 (Mapper 1, Submapper 0)
# 64KB PRG-ROM (4 × 16KB banks) + 32KB CHR-ROM (4 × 8KB or 8 × 4KB) + 8KB PRG-RAM

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 4 × 16KB PRG banks (only last bank has code, others have signatures)
    PRG_B0:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
    # 8 × 4KB CHR banks
    CHR_B0:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B4:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B5:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B6:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B7:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code lives in the last (fixed) bank
    CODE:      load = PRG_B3,  type = ro, start = $C000;
    RODATA:    load = PRG_B3,  type = ro;
    VECTORS:   load = PRG_B3,  type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B3, type = ro, optional = yes;
    # Bank signature segments
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    # CHR bank signature segments
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
    CHR_SIG4:  load = CHR_B4,  type = ro, optional = yes;
    CHR_SIG5:  load = CHR_B5,  type = ro, optional = yes;
    CHR_SIG6:  load = CHR_B6,  type = ro, optional = yes;
    CHR_SIG7:  load = CHR_B7,  type = ro, optional = yes;
    # ASCII font in first CHR bank
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
