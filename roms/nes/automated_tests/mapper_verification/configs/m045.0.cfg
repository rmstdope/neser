    PRG_B9:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B10:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B11:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
