    PRG_B13:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B14:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B15:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B16:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B17:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B18:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B19:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
