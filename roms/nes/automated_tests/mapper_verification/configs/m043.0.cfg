# m043.0.cfg — TONY-I / YS-612 (Mapper 43)
# 80KB PRG-ROM:
#   - 64KB main area (banks 0-7)
#   - 8KB repeated 2KB chip at $5000-$5FFF
#   - 8KB final fixed bank at $E000-$FFFF

MEMORY {
    HEADER:    start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:        start = $0010, size = $00F0, type = rw;
    RAM:       start = $0200, size = $0600, type = rw;
    PRG_B0:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:    start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:    start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:    start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:    start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:    start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:    start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_MID:   start = $5000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_LAST:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    CHR_B0:    start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:     load = HEADER,   type = ro;
    ZEROPAGE:   load = ZP,       type = zp;
    BSS:        load = RAM,      type = bss;
    CODE:       load = PRG_LAST, type = ro, start = $E000;
    RODATA:     load = PRG_LAST, type = ro;
    VECTORS:    load = PRG_LAST, type = ro, start = $FFFA;
    PRG_SIG0:   load = PRG_B4,   type = ro, optional = yes, start = $C000;
    PRG_SIG1:   load = PRG_B3,   type = ro, optional = yes, start = $C000;
    PRG_SIG2:   load = PRG_B5,   type = ro, optional = yes, start = $C000;
    PRG_SIG3:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG4:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG5:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG6:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG7:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG8:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG9:   load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG10:  load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG11:  load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG12:  load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG13:  load = PRG_MID,  type = ro, optional = yes;
    PRG_SIG14:  load = PRG_MID,  type = ro, optional = yes;
    CHR_SIG0:   load = CHR_B0,   type = ro, optional = yes;
    CHARS:      load = CHR_B0,   type = ro, optional = yes, start = $0200;
}
