# m006.0.cfg — Front Fareast Magic Card (Mapper 6, Submapper 0)
# 128KB PRG-ROM (8 × 16KB banks) + 32KB CHR-ROM (4 × 8KB banks) + 32KB WRAM
# Mode 1: 16KB bank switchable at $8000, bank #7 fixed at $C000

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 8 × 16KB PRG banks
    PRG_B0:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
    # 4 × 8KB CHR banks
    CHR_B0:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    CODE:      load = PRG_B7,  type = ro, start = $C000;
    RODATA:    load = PRG_B7,  type = ro;
    VECTORS:   load = PRG_B7,  type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B7, type = ro, optional = yes;
    # PRG bank signatures (banks 0-6; bank 7 is code/fixed)
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $8000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $8000;
    # CHR bank signatures
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
    # ASCII font in first CHR bank
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
