# m099.1.cfg — VS System (Mapper 99, Submapper 1) — 40KB PRG variant
# 40KB PRG-ROM (5 × 8KB banks) + 16KB CHR-ROM (2 × 8KB banks) + 8KB PRG-RAM (status byte)
#
# PRG layout (6 × 8KB = 48KB, padded from 40KB to fill 3 × 16KB):
#   Bank 0 ($8000): switchable via $4016 bit 2 (default state)
#   Bank 1 ($A000): fixed
#   Bank 2 ($C000): fixed
#   Bank 3 ($E000): fixed — CODE lives here
#   Bank 4 ($8000): switchable via $4016 bit 2 (alternate state)
#   Bank 5: padding (fills the 48KB = 3 × 16KB NES 2.0 boundary)
#
# The emulator maps $E000 → page 3 → bank 3, so code must be in bank 3.
# When OUT2 = 1, $8000 maps to bank 4.
#
# Logical bank mapping for test:
#   PRG_SIG0 → bank 0 (at $8000 when bit 2 = 0)
#   PRG_SIG1 → bank 4 (at $8000 when bit 2 = 1)

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 6 × 8KB PRG banks (3 × 16KB units to fill NES 2.0 header)
    # Bank 0: $8000 (switchable, default)
    PRG_B0:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Bank 1: $A000 (fixed)
    PRG_B1:   start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Bank 2: $C000 (fixed)
    PRG_B2:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Bank 3: $E000 (fixed — code bank)
    PRG_B3:   start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Bank 4: $8000 (switchable, alternate)
    PRG_B4:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Bank 5: padding (fills 48KB boundary)
    PRG_B5:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # 2 × 8KB CHR banks
    CHR_B0:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code in bank 3 (fixed at $E000 by mapper)
    CODE:      load = PRG_B3,  type = ro, start = $E000;
    RODATA:    load = PRG_B3,  type = ro;
    VECTORS:   load = PRG_B3,  type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B3, type = ro, optional = yes;
    # PRG bank signatures: logical bank 0 and 1
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    # Extra signatures placed in non-tested banks (required by shared test)
    PRG_SIG2:  load = PRG_B1,  type = ro, optional = yes, start = $A000;
    PRG_SIG3:  load = PRG_B2,  type = ro, optional = yes, start = $C000;
    PRG_SIG4:  load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $8010;
    PRG_SIG6:  load = PRG_B5,  type = ro, optional = yes, start = $8020;
    # CHR bank signatures
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    # ASCII font in CHR bank 0
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
