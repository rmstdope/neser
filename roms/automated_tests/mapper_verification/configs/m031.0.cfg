# m031.0.cfg — NSF Subset Mapper (Mapper 31, Submapper 0)
# 64KB PRG-ROM (16 × 4KB banks) + 8KB CHR-RAM
# Slots 0-5 switchable via $5FF8-$5FFD; slots 6-7 fixed to banks 14-15.
# CODE in bank 14 ($E000) and 15 ($F000, vectors).

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    # 16 × 4KB PRG banks (banks 0-13 switchable, 14-15 fixed for code)
    PRG_B0:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B8:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B9:   start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B10:  start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B11:  start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B12:  start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B13:  start = $8000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B14:  start = $E000, size = $1000, type = ro, fill = yes, fillval = $FF;
    PRG_B15:  start = $F000, size = $1000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code in slot 6 (bank 14 at $E000); vectors in slot 7 (bank 15 at $F000)
    CODE:      load = PRG_B14, type = ro, start = $E000;
    RODATA:    load = PRG_B14, type = ro;
    VECTORS:   load = PRG_B15, type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B14, type = ro, optional = yes;
    # PRG bank signatures for slot 0 test (banks 0-2 cover the basic test)
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $8000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $8000;
    # No CHR-ROM segments (CHR-RAM only)
}
