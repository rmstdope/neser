# m207.0.cfg — Taito X1-005 Alternate Mirroring (Mapper 207, Submapper 0)
# 64KB PRG-ROM (8 × 8KB banks) + 16KB CHR-ROM (16 × 1KB banks)
#
# PRG layout:
#   Banks B0–B5 at $8000: test banks for PRG slot switching (any slot)
#   Bank  B6   at $C000: second-to-last 8KB bank (default $C000 mapping at power-on)
#   Bank  B7   at $E000: last 8KB bank — fixed $E000–$FFFF, holds test code
#
# CHR layout:
#   Banks CHR_B0–CHR_B7:  individual 1KB test banks (banks 0–7)
#   CHR_FONT:             2KB area for 1KB banks 8+9 (ASCII font)

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    # 8 × 8KB PRG banks
    PRG_B0:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # 16 × 1KB CHR banks: banks 0–7 individual, 8+9 merged for font
    CHR_B0:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B4:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B5:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B6:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B7:   start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_FONT: start = $0000, size = $0800, type = ro, fill = yes, fillval = $00;
    CHR_B10:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B11:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B12:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B13:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B14:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
    CHR_B15:  start = $0000, size = $0400, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code in last bank (fixed at $E000–$FFFF)
    CODE:      load = PRG_B7,  type = ro, start = $E000;
    RODATA:    load = PRG_B7,  type = ro;
    VECTORS:   load = PRG_B7,  type = ro, start = $FFFA;
    BANK_TABLE: load = PRG_B7, type = ro, optional = yes;
    # PRG bank signatures (all test banks start at $8000 window)
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $8000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $8000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $8000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $8000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $C000;
    # CHR bank signatures
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
    CHR_SIG4:  load = CHR_B4,  type = ro, optional = yes;
    CHR_SIG5:  load = CHR_B5,  type = ro, optional = yes;
    CHR_SIG6:  load = CHR_B6,  type = ro, optional = yes;
    CHR_SIG7:  load = CHR_B7,  type = ro, optional = yes;
    # SIG8/SIG9 in CHR_FONT area (before the font glyphs at $0200)
    CHR_SIG8:  load = CHR_FONT, type = ro, optional = yes;
    CHR_SIG9:  load = CHR_FONT, type = ro, optional = yes;
    CHR_SIG10: load = CHR_B10, type = ro, optional = yes;
    CHR_SIG11: load = CHR_B11, type = ro, optional = yes;
    CHR_SIG12: load = CHR_B12, type = ro, optional = yes;
    CHR_SIG13: load = CHR_B13, type = ro, optional = yes;
    CHR_SIG14: load = CHR_B14, type = ro, optional = yes;
    CHR_SIG15: load = CHR_B15, type = ro, optional = yes;
    # ASCII font in CHR banks 8+9 (2KB area starting at tile $02 = offset $0200)
    CHARS:     load = CHR_FONT, type = ro, optional = yes, start = $0200;
}
