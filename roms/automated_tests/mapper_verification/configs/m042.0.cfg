# m042.0.cfg — Mario Baby / Ai Senshi Nicol (Mapper 42, Submapper 0)
# 128KB PRG-ROM (16 × 8KB banks) + 128KB CHR-ROM (16 × 8KB banks)
# Bank $6000-$7FFF is switchable; $8000-$FFFF is fixed to the last 32KB.

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    # 16 × 8KB PRG banks. Bank 15 holds the fixed code at $E000-$FFFF.
    PRG_B0:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B4:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B5:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B6:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B7:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B8:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B9:   start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B10:  start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B11:  start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B12:  start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B13:  start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B14:  start = $6000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_B15:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # 16 × 8KB CHR banks
    CHR_B0:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B4:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B5:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B6:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B7:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B8:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B9:   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B10:  start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B11:  start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B12:  start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B13:  start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B14:  start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
    CHR_B15:  start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    CODE:      load = PRG_B15, type = ro, start = $E000;
    RODATA:    load = PRG_B15, type = ro;
    VECTORS:   load = PRG_B15, type = ro, start = $FFFA;
    PRG_SIG0:  load = PRG_B0,  type = ro, optional = yes, start = $6000;
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $6000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $6000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $6000;
    PRG_SIG4:  load = PRG_B4,  type = ro, optional = yes, start = $6000;
    PRG_SIG5:  load = PRG_B5,  type = ro, optional = yes, start = $6000;
    PRG_SIG6:  load = PRG_B6,  type = ro, optional = yes, start = $6000;
    PRG_SIG7:  load = PRG_B7,  type = ro, optional = yes, start = $6000;
    PRG_SIG8:  load = PRG_B8,  type = ro, optional = yes, start = $6000;
    PRG_SIG9:  load = PRG_B9,  type = ro, optional = yes, start = $6000;
    PRG_SIG10: load = PRG_B10, type = ro, optional = yes, start = $6000;
    PRG_SIG11: load = PRG_B11, type = ro, optional = yes, start = $6000;
    PRG_SIG12: load = PRG_B12, type = ro, optional = yes, start = $6000;
    PRG_SIG13: load = PRG_B13, type = ro, optional = yes, start = $6000;
    PRG_SIG14: load = PRG_B14, type = ro, optional = yes, start = $6000;
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
    CHR_SIG4:  load = CHR_B4,  type = ro, optional = yes;
    CHR_SIG5:  load = CHR_B5,  type = ro, optional = yes;
    CHR_SIG6:  load = CHR_B6,  type = ro, optional = yes;
    CHR_SIG7:  load = CHR_B7,  type = ro, optional = yes;
    CHR_SIG8:  load = CHR_B8,  type = ro, optional = yes;
    CHR_SIG9:  load = CHR_B9,  type = ro, optional = yes;
    CHR_SIG10: load = CHR_B10, type = ro, optional = yes;
    CHR_SIG11: load = CHR_B11, type = ro, optional = yes;
    CHR_SIG12: load = CHR_B12, type = ro, optional = yes;
    CHR_SIG13: load = CHR_B13, type = ro, optional = yes;
    CHR_SIG14: load = CHR_B14, type = ro, optional = yes;
    CHR_SIG15: load = CHR_B15, type = ro, optional = yes;
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
