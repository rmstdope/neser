# m111.0.cfg — GTROM / Cheapocabra (Mapper 111, Submapper 0)
# 128KB PRG-ROM (4 x 32KB banks) + 16KB CHR-RAM (2 x 8KB)

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    # 4 x 32KB PRG banks
    PRG_B0:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
    PRG_B2:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
    PRG_B3:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code in bank 0 (mapped at power-on)
    CODE:      load = PRG_B0,  type = ro, start = $8000;
    RODATA:    load = PRG_B0,  type = ro;
    VECTORS:   load = PRG_B0,  type = ro, start = $FFFA;
    # Bank signatures
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    PRG_SIG2:  load = PRG_B2,  type = ro, optional = yes, start = $8000;
    PRG_SIG3:  load = PRG_B3,  type = ro, optional = yes, start = $8000;
}
