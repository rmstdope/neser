# m034.0.cfg — BNROM/NINA-001 (Mapper 34, Submapper 0)
# 64KB PRG-ROM (2 × 32KB banks) + 64KB CHR-ROM (16 × 4KB banks) + 8KB PRG-RAM

MEMORY {
    HEADER:   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    ZP:       start = $0010, size = $00F0, type = rw;
    RAM:      start = $0200, size = $0600, type = rw;
    SRAM:     start = $6000, size = $2000, type = rw;
    # 2 × 32KB PRG banks
    PRG_B0:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
    PRG_B1:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
    # 16 × 4KB CHR banks
    CHR_B0:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B1:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B2:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B3:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B4:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B5:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B6:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B7:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B8:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B9:   start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B10:  start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B11:  start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B12:  start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B13:  start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B14:  start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
    CHR_B15:  start = $0000, size = $1000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:    load = HEADER,  type = ro;
    ZEROPAGE:  load = ZP,      type = zp;
    BSS:       load = RAM,     type = bss;
    # Code in bank 0 (power-on default)
    CODE:      load = PRG_B0,  type = ro, start = $8000;
    RODATA:    load = PRG_B0,  type = ro;
    VECTORS:   load = PRG_B0,  type = ro, start = $FFFA;
    # PRG bank signatures (bank 1; bank 0 is code)
    PRG_SIG1:  load = PRG_B1,  type = ro, optional = yes, start = $8000;
    # CHR bank signatures
    CHR_SIG0:  load = CHR_B0,  type = ro, optional = yes;
    CHR_SIG1:  load = CHR_B1,  type = ro, optional = yes;
    CHR_SIG2:  load = CHR_B2,  type = ro, optional = yes;
    CHR_SIG3:  load = CHR_B3,  type = ro, optional = yes;
    CHR_SIG4:  load = CHR_B4,  type = ro, optional = yes;
    CHR_SIG5:  load = CHR_B5,  type = ro, optional = yes;
    CHR_SIG6:  load = CHR_B6,  type = ro, optional = yes;
    CHR_SIG7:  load = CHR_B7,  type = ro, optional = yes;
    CHR_SIG8:  load = CHR_B8,  type = ro, optional = yes;
    CHR_SIG9:  load = CHR_B9,  type = ro, optional = yes;
    CHR_SIG10: load = CHR_B10, type = ro, optional = yes;
    CHR_SIG11: load = CHR_B11, type = ro, optional = yes;
    CHR_SIG12: load = CHR_B12, type = ro, optional = yes;
    CHR_SIG13: load = CHR_B13, type = ro, optional = yes;
    CHR_SIG14: load = CHR_B14, type = ro, optional = yes;
    CHR_SIG15: load = CHR_B15, type = ro, optional = yes;
    # ASCII font in first CHR bank
    CHARS:     load = CHR_B0,  type = ro, optional = yes, start = $0200;
}
